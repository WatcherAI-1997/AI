# Автор: Джама Ваккасов (jamavakkasoff@gmail.com)

version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: tamerlanai_postgres
    environment:
      POSTGRES_USER: tamerlan
      POSTGRES_PASSWORD: tamerlan
      POSTGRES_DB: tamerlanai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tamerlan"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: tamerlanai_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Backend API (когда будет Dockerfile)
  # backend:
  #   build: ./backend
  #   container_name: tamerlanai_backend
  #   ports:
  #     - "8000:8000"
  #   environment:
  #     - DATABASE_URL=postgresql+asyncpg://tamerlan:tamerlan@postgres:5432/tamerlanai
  #     - REDIS_URL=redis://redis:6379/0
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #   volumes:
  #     - ./backend:/app
  #     - ./models:/app/models

volumes:
  postgres_data:
  redis_data:
